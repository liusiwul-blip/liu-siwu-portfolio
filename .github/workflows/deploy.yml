name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Unpack portfolio site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          if [ ! -f portfolio-site.zip ]; then
            echo "::error::Missing portfolio-site.zip. Upload the website ZIP to the repository root, named portfolio-site.zip."
            exit 1
          fi
          mkdir -p extracted
          unzip -q portfolio-site.zip -d extracted
          SITE_DIR="extracted/Liu_Siwu_Portfolio_Site"
          if [ ! -f "$SITE_DIR/index.html" ]; then
            echo "::error::Expected index.html inside Liu_Siwu_Portfolio_Site/"
            find extracted -maxdepth 3 -type f | head -80
            exit 1
          fi
          cp -R "$SITE_DIR"/. public/
          test -f public/index.html
          echo "Portfolio files prepared:"
          find public -maxdepth 2 -type f | head -80

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
